name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: followup
          POSTGRES_PASSWORD: followup
          POSTGRES_DB: followup_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U followup"
          --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://followup:followup@localhost:5432/followup_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/setup.py
      - run: ruff check .
      - run: ruff format --check .
      - run: DATABASE_URL="$TEST_DATABASE_URL" alembic upgrade head
      - run: pytest -q
      - run: docker build -t gmail-followup-agent .
